name: Validate Historic Timeline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check src/model.js
          node --check tests/browser-smoke.mjs
          node --check data/expanded-events.js
          node --check data/reading-links.js
          node --check data/locations.js
          node --check data/expanded-societies.js
      - name: Run unit tests
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Chromium smoke tests
        run: npm run test:browser
